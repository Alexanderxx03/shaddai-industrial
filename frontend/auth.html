            <h1 class="text-2xl font-bold text-white font-display">Portal Clientes Corporativos</h1>
            <p class="text-sm text-slate-400 mt-1">Accede para gestionar tus solicitudes de cotización e historial técnico.</p>

        <form id="auth-form" class="p-8 space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Correo Corporativo</label>
                <input type="email"
                    class="w-full border border-slate-700 rounded-lg p-3 bg-slate-950/60 text-white placeholder-slate-500 focus:border-ind-blue-light focus:ring-1 focus:ring-ind-blue-light focus:outline-none transition-all"
                    placeholder="logistica@empresa.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Contraseña</label>
                <input type="password"
                    class="w-full border border-slate-700 rounded-lg p-3 bg-slate-950/60 text-white placeholder-slate-500 focus:border-ind-blue-light focus:ring-1 focus:ring-ind-blue-light focus:outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-ind-blue hover:bg-ind-blue-light text-white font-bold py-3 rounded-lg mt-4 transition-all duration-300 shadow-lg shadow-ind-blue/20 hover:shadow-ind-blue-light/30 uppercase tracking-wider text-sm">
                Iniciar Sesión
            </button>
        </form>

        <div class="px-8 pb-8 text-center">
            <p class="text-sm text-slate-400">¿Deseas solicitar una cotización directa? <a href="checkout.html"
                    class="text-ind-blue-light hover:underline font-bold">Ver Cotizador</a></p>
            <a href="index.html" class="block mt-4 text-xs text-slate-500 hover:text-slate-300 underline transition-colors">Volver al
